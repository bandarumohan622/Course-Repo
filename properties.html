<!DOCTYPE html>
<html lang="en">
    <head>
   
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Internal Style</title>
    <style>
        #id1{
            font-family: Arial, Helvetica, sans-serif;
            font-size: 30px;
            font-style: italic;
           
            text-decoration: underline;
            text-align: center;
        }
        #id2{
             font-weight: bold;
             word-spacing: 10px;
             letter-spacing: 5px;
             font-variant: small-caps;
             line-height: 50px;
             text-transform: capitalize;
             text-align: center;
        }
     </style>   
    </head>
   <body>
      <h1 id="id1">this is font property</h1>
      <p id="id2">lorem ipsum dolor sit amet</p>
   </body>
</html>
