<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        header {
            background-color: #333;
            color: #fff;
            padding: 10px;
            display: flex;
            align-items: center;
        }
        .logo {
            width: 225px;
            height: 225px;
            margin-right: 10px;
        }
       nav ul{
        list-style-type: none;
       }
       nav ul li{
        display: inline-block;
        margin: 0px 1px;
       }
       nav ul li a{
        color: #fff;
        text-decoration: none;
        padding: 70px 115px;
        border-radius: 5px;
       }
       fieldset{
        font-size: 22px;
        border: 2px solid #291c7d;
        padding: 20px;
        margin: 20px;
       }
       legend{
        font-size: 22px;
        font-weight: bold;
        form{
            font-size: 22px;
            background-color: #f2f2f2;

            padding: 10px;
            border-radius: 5px;
            width: 400px;
            margin: 0 auto;
        }
       }
       label{
        display: inline-block;
        width: 80px;
        margin: 10px;
        height: 20px;
       }
       input{
        padding: 5px;
        margin: 10px;
        width: 200px;
       }
           
        
    </style>
</head>
<body>
    <header>
         <img class="logo" src="gensarimage.jpg" alt="gensar it">
        <nav>
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    <fieldset>
        <legend>personal information</legend>
        <form>
            <div>
            <label>name:</label>
            <input type="text" placeholder="enter your name"/><br>
            </div>
            <div>
            <label>mobile no:</label>
            <input type="number" placeholder="enter your mobile number"/><br>
            </div>
            <div>
            <label>gender:</label>
            <select>
                <option value="male">male</option>
                <option value="female">female</option>
            </select><br>
            </div>
            <div>
                <label>email:</label>
                <input type="email" placeholder="enter your email"/><br>
            </div>
            <div>
                <label>password:</label>
                <input type="password" placeholder="enter your password"/><br>
            </div>
            <input type="submit" value="Login">
            <input type="reset" value="newuser">
        </form>
    </fieldset>
    

</body>
</html>
