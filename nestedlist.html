<html>
    <head>
        <title>nested list</title>
    </head>
    <body>
        <h1>nested list example:</h1>
       
        <dl>
            <ol>
                <dt><li>frontend</li></dt>
                <ul>
                    <li>html</li>
                    <li>css</li>
                    <li>javascript</li>
                </ul>
                <ol>
                <dt><li>backend</li></dt>
                <ul>
                    <li>python</li>
                    <li>sql</li>
                    <li>dijango</li>
                    </ul>
                <ol>
                    <dt><li>fullstack</li></dt>
                <ul>
                    <li>all</li>
                </ul>
                </ol>
                </ol>

            </ol>
        </dl>
        
        </body>
</html>
