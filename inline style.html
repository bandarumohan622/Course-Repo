<!--inline style sheet by using inline style sheet we can apply styling to the particular html element only, by using style element-->

<!DOCTYPE html>        
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Inline Style</title>
    </head>
   <body>
        <h1 style="color:blue;background-color: brown;">Gensar</h1>
        <h1 style="color:green;background-color: yellow;">this is second element</h1>
        <p style="color: red;background-color: black;">this is third element</p>
    </body>
   </html>
