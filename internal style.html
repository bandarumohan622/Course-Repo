<!--internal style.css-->
<!--internal style sheet is used to apply different styles to the different elements by using selectors-->
<!--slector used to apply styling to different element by accessing a unique name of the element-->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Internal Style</title>
        <style>
            #id1{
                color: red;
                background-color: yellow;
            }
            #id2,h3{
                color: blue;
                background-color: green;
            }
            .class1,p{
                color: orange;
                background-color: pink;
            }
            #id4{
               
                background-color: black;
            }
           
            
            *{
                text-align: center;
                color: white;
            }

           
        </style>
    </head>
   <body>
        <h1 id="id1">Gensar</h1>
        <h2 id="id2">this is second element</h2>
        <h1 class="class1">this is third element</h1>
        <h2 class="class1">this is fourth element</h2>
        <p>this is paragraph</p>
        <p id="id4">this is second paragraph</p>
        <h3>this is h3 element</h3>
    </body>
   </html>
