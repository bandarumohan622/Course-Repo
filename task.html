<html>
    <head>
        <title>list example</title>
    </head>
    <body>
        <h1>order list examples</h1>
        <ol type="i">
            <li>html</li>
            <li>css</li>
            <li>javascript></li>
        </ol>
        <h1><u>circle="unorder items"</u></h1>
        <ul type="square">
            <li>python</li>
            <li>sql</li>
            <li>dijango</li>
        </ul>
        <h1>defnition list</h1>
            <dl>
                <dt>front-end</dt>
                <dd>html</dd>
                <dd>css</dd>
                <dd>javascript</dd>
                <dt>backend</dt>
                <dd>java</dd>
                <dd>python</dd>
                <dd>sql</dd>
                <h1>nestedlist</h1>
            </dl>
                    <ol>
                        <dt><li>front-end</li></dt>
                    <dd>
                        <ul>
                            <li>html</li>
                            <li>css</li>
                            <li>javascript</li>
                        </ul>
                    </dd>
                        <dt><li>backend</li></dt>
                        <ul>
                            <li>python</li>
                            <li>sql</li>
                        </ul>
                    </ol>
                </dl>
        </dl>
        

    </body>
</html>
