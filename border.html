<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Internal Style</title>
        <style>
            #id1{
                border: 5px solid red;
            }
            #id2{
                border: 5px solid blue;
            }
            #id3{
                border: 5px dotted green;
                background-color: yellow;
            }
            #id4{
                border: 5px dashed orange;
                background-color: pink;
            }
            .class1,p{
                border: 5px groove black;
                background-color: lightblue;
                
            }
            .class2{
                border: 5px inset brown;
                background-color: lightgreen;
            }
            .class3{
                border: 5px double purple;
                background-color: lightyellow;
            }
            h1{
                border: 5px outset gray;
                background-color: lightgray;
            }
            h2{
                border: 5px ridge silver;
                background-color: lightcoral;
            }
            h3{
                border: 5px none black;
                background-color: lightpink;
            }
            
            
           
        </style>
    </head>
   <body>
         <h1 id="id1">this is h1 element</h1>
        <span id="id2">this is inline element</span>
        <h3 id="id3">this is dotted border</h3>
        <h3 id="id4">this is dashed border</h3>
        <p class="class1">this is paragraph</p>
        <p class="class1">this is second paragraph</p>
        <p class="class2">this is third paragraph</p>
        <p class="class3">this is fourth paragraph</p>
        <h1>this is outset boder</h1>
        <h2>this is second element</h2>
        <h3>this is third element</h3>
    </body>
    </html>
